<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f8">
<meta name="description" content="Live kampklokker, tabell og sluttspill for kubbmesterskapet.">
<title>Kilkast</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23191c22'/><rect x='9' y='7' width='5' height='18' rx='1.4' fill='%23f6f7f8'/><rect x='18' y='12' width='5' height='13' rx='1.4' fill='%2358c48a'/></svg>">
<style>
/* ============================================================
   KUBBMESTERSKAP — design tokens
   Scene: 22 grader, gress, sol i skjermen, blikk på 3 sekunder.
   Strategi: monokromt blekk på papir. Den eneste kuløren i hele
   grensesnittet er tid som står igjen. Mørkt er reservert storskjerm.
   ============================================================ */
:root{
  color-scheme: light;

  --bg:        oklch(0.972 0.003 260);
  --surface:   oklch(1 0 0);
  --surface-2: oklch(0.953 0.004 260);
  --surface-3: oklch(0.925 0.005 260);

  --ink:   oklch(0.19  0.014 260);
  --ink-2: oklch(0.445 0.012 260);
  --ink-3: oklch(0.533 0.011 260);
  --on-ink:oklch(0.985 0.002 260);

  --line:   oklch(0.905 0.005 260);
  --line-2: oklch(0.845 0.006 260);

  /* tidsstatus — eneste kulør i systemet */
  --go:   oklch(0.505 0.145 152);
  --warn: oklch(0.545 0.135 68);
  --over: oklch(0.525 0.195 26);
  --go-w:   color-mix(in oklch, var(--go) 12%, transparent);
  --warn-w: color-mix(in oklch, var(--warn) 14%, transparent);
  --over-w: color-mix(in oklch, var(--over) 13%, transparent);

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:32px; --s8:40px;
  --r1:10px; --r2:14px; --r3:20px; --r4:26px;

  --shadow-1: 0 1px 2px oklch(0.19 0.014 260 / .05), 0 1px 1px oklch(0.19 0.014 260 / .04);
  --shadow-2: 0 4px 16px -4px oklch(0.19 0.014 260 / .12), 0 1px 2px oklch(0.19 0.014 260 / .05);
  --shadow-3: 0 24px 60px -18px oklch(0.19 0.014 260 / .35);

  --z-nav:20; --z-head:30; --z-backdrop:40; --z-sheet:50; --z-toast:60; --z-count:70;

  --e-out:  cubic-bezier(.22,1,.36,1);
  --e-expo: cubic-bezier(.16,1,.3,1);

  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, "JetBrains Mono", "Roboto Mono", Menlo, monospace;
}

/* storskjerm: innendørs/skygge, blikk på 15 meter → invertert */
body.tv{
  color-scheme: dark;
  --bg:        oklch(0.165 0.012 260);
  --surface:   oklch(0.215 0.013 260);
  --surface-2: oklch(0.255 0.014 260);
  --surface-3: oklch(0.30 0.015 260);
  --ink:   oklch(0.975 0.003 260);
  --ink-2: oklch(0.78 0.010 260);
  --ink-3: oklch(0.63 0.012 260);
  --on-ink:oklch(0.18 0.014 260);
  --line:   oklch(0.31 0.014 260);
  --line-2: oklch(0.38 0.016 260);
  --go:   oklch(0.80 0.175 152);
  --warn: oklch(0.83 0.155 78);
  --over: oklch(0.70 0.185 25);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:400 15px/1.45 var(--sans);
  font-synthesis-weight:none;
  -webkit-font-smoothing:antialiased;
  min-height:100dvh;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
  overscroll-behavior-y:none;
}
h1,h2,h3{margin:0;font-weight:640;letter-spacing:-.014em;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
.hide{display:none !important}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

input,select,textarea{
  font:inherit;color:var(--ink);background:var(--surface);
  border:1px solid var(--line-2);border-radius:var(--r1);
  padding:11px 12px;width:100%;transition:border-color .14s var(--e-out), box-shadow .14s var(--e-out);
}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
input:focus,textarea:focus,select:focus{
  outline:none;border-color:var(--ink);
  box-shadow:0 0 0 3px color-mix(in oklch, var(--ink) 12%, transparent);
}
textarea{resize:vertical;line-height:1.5;font-family:var(--mono);font-size:13px}

/* ---------------- header ---------------- */
.head{
  position:sticky;top:0;z-index:var(--z-head);
  display:flex;align-items:center;gap:var(--s3);
  padding:calc(env(safe-area-inset-top) + 12px) var(--s4) 12px;
  background:color-mix(in oklch, var(--bg) 84%, transparent);
  backdrop-filter:saturate(1.6) blur(14px);
  border-bottom:1px solid var(--line);
}
.head h1{flex:1;min-width:0;font-size:16px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{
  display:flex;align-items:center;gap:6px;flex:0 0 auto;min-height:40px;
  font-size:12.5px;font-weight:560;color:var(--ink-2);
  padding:6px 13px;border:1px solid var(--line-2);border-radius:999px;background:var(--surface);
  transition:transform .12s var(--e-out),border-color .14s;
}
.who:active{transform:scale(.96)}
.who .pip{width:6px;height:6px;border-radius:50%;background:var(--ink-3)}
.who[data-role="admin"] .pip,.who[data-role="team"] .pip{background:var(--go)}

main{max-width:960px;margin:0 auto;padding:var(--s4) var(--s4) var(--s7)}

/* ---------------- nav ---------------- */
.nav{
  position:fixed;inset:auto 0 0;z-index:var(--z-nav);
  display:grid;grid-template-columns:repeat(var(--n,4),1fr);
  gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  background:color-mix(in oklch, var(--bg) 88%, transparent);
  backdrop-filter:saturate(1.6) blur(16px);
  border-top:1px solid var(--line);
}
.nav button{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:8px 2px 6px;border-radius:12px;
  font-size:10.5px;font-weight:560;letter-spacing:-.005em;color:var(--ink-3);
  transition:color .16s var(--e-out), background-color .16s var(--e-out);
}
.nav button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button:active{background:var(--surface-2)}
.nav button[aria-current="page"]{color:var(--ink);font-weight:620}

/* ---------------- typografi / seksjoner ---------------- */
.eyebrow{
  display:flex;align-items:baseline;gap:8px;
  margin:var(--s6) 2px var(--s3);font-size:13px;font-weight:620;color:var(--ink);letter-spacing:-.01em;
}
.eyebrow:first-child{margin-top:2px}
.eyebrow small{font-weight:460;color:var(--ink-3);font-size:12.5px;letter-spacing:0}

.panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);
  box-shadow:var(--shadow-1);
}
.pad{padding:var(--s4)}

/* ---------------- knapper ---------------- */
.btn{
  --bg-b:var(--surface); --fg-b:var(--ink); --bd-b:var(--line-2);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:46px;padding:0 16px;border-radius:var(--r1);
  background:var(--bg-b);color:var(--fg-b);border:1px solid var(--bd-b);
  font-size:14.5px;font-weight:580;letter-spacing:-.008em;white-space:nowrap;
  box-shadow:var(--shadow-1);
  transition:transform .11s var(--e-out), background-color .16s var(--e-out), border-color .16s, opacity .16s;
}
.btn:active{transform:scale(.975)}
.btn.primary{--bg-b:var(--ink); --fg-b:var(--on-ink); --bd-b:var(--ink)}
.btn.ghost{--bg-b:transparent; --bd-b:transparent; --fg-b:var(--ink-2);box-shadow:none}
.btn.ghost:active{background:var(--surface-2)}
.btn.quiet{--bg-b:var(--surface-2); --bd-b:transparent;box-shadow:none}
.btn.danger{--fg-b:var(--over); --bd-b:color-mix(in oklch,var(--over) 35%,transparent); --bg-b:var(--over-w);box-shadow:none}
.btn.sm{min-height:34px;padding:0 11px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.42;pointer-events:none}
.btn.busy{pointer-events:none;opacity:.7}
.cluster{display:flex;gap:var(--s2)}
.cluster>*{flex:1}

.seg{display:flex;gap:3px;padding:3px;background:var(--surface-2);border-radius:12px;margin-bottom:var(--s4)}
.seg button{
  flex:1;min-height:34px;border-radius:9px;font-size:13px;font-weight:560;color:var(--ink-2);
  transition:background-color .18s var(--e-out), color .18s var(--e-out), box-shadow .18s;
}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:620;box-shadow:var(--shadow-1)}

/* ---------------- innlogging ---------------- */
.auth{max-width:340px;margin:0 auto;padding:min(10vh,72px) var(--s5) var(--s8);text-align:center}
.mark{width:56px;height:56px;margin:0 auto var(--s5);border-radius:16px;background:var(--ink);display:grid;place-items:center;box-shadow:var(--shadow-2)}
.mark svg{width:30px;height:30px}
.auth h1{font-size:25px;letter-spacing:-.026em}
.auth .lede{color:var(--ink-2);margin:6px 0 var(--s7);font-size:14.5px}
.dots{display:flex;justify-content:center;gap:12px;margin-bottom:var(--s6);height:16px}
.dots i{
  width:12px;height:12px;border-radius:50%;background:transparent;
  border:1.5px solid var(--line-2);
  transition:transform .2s var(--e-expo), background-color .2s var(--e-out), border-color .2s;
}
.dots i.on{background:var(--ink);border-color:var(--ink);transform:scale(1.12)}
.dots i.cur{border-color:var(--ink-2)}
.dots.bad{animation:shake .4s var(--e-out)}
@keyframes shake{
  0%,100%{transform:translateX(0)} 18%{transform:translateX(-7px)} 38%{transform:translateX(6px)}
  58%{transform:translateX(-4px)} 78%{transform:translateX(2px)}
}
.pad-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad-grid button{
  height:58px;border-radius:var(--r2);background:var(--surface);border:1px solid var(--line);
  font-size:22px;font-weight:520;letter-spacing:-.02em;box-shadow:var(--shadow-1);
  font-family:var(--mono);
  transition:transform .1s var(--e-out), background-color .14s;
}
.pad-grid button:active{transform:scale(.94);background:var(--surface-2)}
.pad-grid button.text{background:transparent;border-color:transparent;box-shadow:none;font-family:var(--sans);font-size:14px;font-weight:560;color:var(--ink-2)}
.pad-grid button[data-empty]{visibility:hidden}
.auth .msg{min-height:22px;margin-top:var(--s5);font-size:13.5px;font-weight:560;color:var(--over)}

/* ---------------- baner ---------------- */
.courts{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:600px){.courts{grid-template-columns:1fr 1fr}}

.court{
  position:relative;overflow:hidden;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);
  box-shadow:var(--shadow-1);
  transition:box-shadow .3s var(--e-out), border-color .3s var(--e-out);
}
.court.enter{animation:cardIn .42s var(--e-expo) both}
@keyframes cardIn{from{opacity:0;transform:translateY(8px) scale(.985)}}
.court[data-state="live"]{border-color:var(--line-2);box-shadow:var(--shadow-2)}
.court[data-tone="over"]{border-color:color-mix(in oklch,var(--over) 45%,transparent)}
.court[data-tone="over"]::after{
  content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  box-shadow:inset 0 0 0 1px color-mix(in oklch,var(--over) 40%,transparent);
  animation:breathe 2s ease-in-out infinite;
}
@keyframes breathe{50%{opacity:.25}}

.court-top{
  display:flex;align-items:center;gap:9px;padding:9px var(--s4);
  border-bottom:1px solid var(--line);background:var(--surface-2);
}
.court-no{
  flex:0 0 auto;min-width:22px;height:22px;padding:0 6px;border-radius:7px;
  background:var(--ink);color:var(--on-ink);
  display:grid;place-items:center;font-size:12px;font-weight:660;font-family:var(--mono);
}
.court-top .cap{flex:1;min-width:0;font-size:12.5px;font-weight:520;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-pip{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:var(--go);animation:beat 2s ease-in-out infinite}
@keyframes beat{50%{opacity:.3}}
.mine-tag{flex:0 0 auto;font-size:11px;font-weight:620;padding:3px 7px;border-radius:6px;background:var(--ink);color:var(--on-ink)}
.new-tag{flex:0 0 auto;font-size:11px;font-weight:720;padding:3px 7px;border-radius:6px;background:var(--go-w);color:var(--go)}

.court-body{display:flex;align-items:center;gap:var(--s4);padding:var(--s4)}
.sides{flex:1;min-width:0;display:grid;gap:3px}
.side{display:flex;align-items:baseline;gap:8px;min-width:0}
.side b{
  font-size:16.5px;font-weight:580;letter-spacing:-.014em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;
}
.side.won b{font-weight:680}
.side.lost b{color:var(--ink-3);font-weight:480}
.side .dash{flex:0 0 auto;font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.06em}

.timer{flex:0 0 auto;text-align:right;display:grid;gap:2px;justify-items:end}
.timer .t{
  font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:31px;font-weight:640;letter-spacing:-.045em;line-height:1;
  color:var(--ink-3);transition:color .5s var(--e-out);
}
.timer[data-tone="go"]   .t{color:var(--go)}
.timer[data-tone="warn"] .t{color:var(--warn)}
.timer[data-tone="over"] .t{color:var(--over)}
.timer .lab{font-size:11px;font-weight:560;color:var(--ink-3);letter-spacing:-.005em;white-space:nowrap}

.track{height:2px;background:var(--surface-3);position:relative;overflow:hidden}
.track>i{
  display:block;height:100%;width:100%;background:var(--ink-3);
  transform-origin:left center;transform:scaleX(1);
  transition:transform .95s linear, background-color .5s var(--e-out);
}
.court-next{padding:9px var(--s4);border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.court-next b{color:var(--ink);font-weight:620}
.turn-call{
  position:sticky;top:8px;z-index:4;display:flex;align-items:center;gap:11px;
  margin-bottom:var(--s4);padding:12px 14px;background:var(--ink);color:var(--on-ink);
  border-radius:var(--r2);box-shadow:var(--shadow-2);animation:cardIn .36s var(--e-expo) both;
}
.turn-call[data-state="ready"]{background:var(--go);color:#062718}
.turn-call[data-state="paused"]{background:var(--warn);color:#2e1900}
.turn-call .turn-mark{flex:0 0 auto;min-width:42px;padding:5px 7px;border:1px solid currentColor;border-radius:7px;text-align:center;font-family:var(--mono);font-size:11px;font-weight:720;text-transform:uppercase}
.turn-call b,.turn-call small{display:block}.turn-call b{font-size:15px;font-weight:680;letter-spacing:-.012em}.turn-call small{margin-top:2px;font-size:12px;opacity:.78}
.timer[data-tone="go"]  ~ .x, .court[data-tone="go"]   .track>i{background:var(--go)}
.court[data-tone="warn"] .track>i{background:var(--warn)}
.court[data-tone="over"] .track>i{background:var(--over)}
.court-actions{display:flex;gap:var(--s2);padding:var(--s3) var(--s4) var(--s4)}
.court-actions>*{flex:1}

.free{padding:var(--s6) var(--s4);text-align:center;color:var(--ink-3);font-size:13.5px}

/* ---------------- kampliste ---------------- */
.list{display:grid;gap:6px}
.mrow{
  display:flex;align-items:center;gap:var(--s3);padding:11px var(--s3) 11px var(--s4);
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r1);
  box-shadow:var(--shadow-1);
}
.mrow.settled{background:var(--surface-2);box-shadow:none}
.mrow .sides{gap:1px}
.mrow .side b{font-size:14.5px}
.mrow .meta{margin-top:4px;font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{
  flex:0 0 auto;font-size:11.5px;font-weight:600;padding:5px 9px;border-radius:8px;
  background:var(--surface-2);color:var(--ink-2);white-space:nowrap;
}
.chip.live{background:var(--go-w);color:var(--go);font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.chip.ready{background:var(--warn-w);color:var(--warn)}
.chip.ink{background:var(--ink);color:var(--on-ink)}

/* ---------------- tabell ---------------- */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}
caption{text-align:left;font-size:13px;font-weight:620;padding:0 0 10px;color:var(--ink)}
th{
  font-size:11px;font-weight:620;color:var(--ink-3);letter-spacing:.02em;
  padding:0 6px 9px;text-align:right;white-space:nowrap;
}
th:nth-child(1){width:28px;text-align:left;padding-left:0}
th:nth-child(2){text-align:left}
th:last-child{padding-right:0}
td{padding:10px 6px;border-top:1px solid var(--line);text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13.5px;color:var(--ink-2)}
td:nth-child(1){text-align:left;padding-left:0;color:var(--ink-3)}
td:nth-child(2){text-align:left;font-family:var(--sans);font-size:14.5px;font-weight:520;color:var(--ink);letter-spacing:-.012em}
td:last-child{padding-right:0;color:var(--ink);font-weight:640}
tr.through td:nth-child(1){color:var(--go);font-weight:700}
tr.through td:nth-child(2){font-weight:620}
tr.self td{background:var(--surface-2)}
tr.self td:nth-child(2)::after{content:"du";margin-left:7px;font-family:var(--sans);font-size:10.5px;font-weight:620;color:var(--on-ink);background:var(--ink);padding:2px 5px;border-radius:5px;vertical-align:1px}
tr.stand-click{cursor:pointer;outline:none}
tr.stand-click td{transition:background-color .15s var(--e-out)}
tr.stand-click td:nth-child(2)::before{content:"›";display:inline-block;margin-right:6px;color:var(--ink-3);font-size:17px;line-height:0;transform:translateY(1px)}
tr.stand-click:hover td,tr.stand-click:focus-visible td{background:var(--surface-2)}
.legend{margin-top:var(--s4);font-size:12.5px;line-height:1.5;color:var(--ink-2)}

/* ---------------- gruppevisning ---------------- */
.group-tabs{display:flex;gap:7px;overflow-x:auto;padding:2px var(--s4) 6px;margin:0 calc(var(--s4) * -1);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.group-tabs::-webkit-scrollbar{display:none}
.group-tabs button{flex:0 0 auto;padding:9px 12px;border:1px solid var(--line-2);border-radius:999px;background:var(--surface);color:var(--ink-2);font-size:12px;font-weight:620;line-height:1;white-space:nowrap;box-shadow:var(--shadow-1)}
.group-tabs button[aria-current="page"]{border-color:var(--ink);background:var(--ink);color:var(--on-ink);box-shadow:none}
.group-header{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s3);padding:var(--s4) var(--s4) var(--s3);background:var(--ink);color:var(--on-ink);border-radius:var(--r2) var(--r2) 0 0}
.group-header .eyebrow{margin:0 0 7px;color:color-mix(in oklch,var(--on-ink) 65%,transparent)}
.group-header .eyebrow small{color:inherit}
.group-header h2{font-size:24px;font-weight:640;letter-spacing:-.035em}
.group-count{flex:0 0 auto;padding:6px 8px;border-radius:7px;background:color-mix(in oklch,var(--on-ink) 12%,transparent);font:600 11px/1 var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.group-board{border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r2) var(--r2);background:var(--surface);padding:var(--s3) var(--s4) var(--s4);box-shadow:var(--shadow-1)}
.group-board caption{font-size:11px;font-weight:600;color:var(--ink-3);padding:0 0 8px}
.group-board th{padding-bottom:8px}
.group-board td{padding-top:11px;padding-bottom:11px}
.group-board tr.leading td:first-child{color:var(--go);font-weight:700}
.group-board tr.leading td:nth-child(2){font-weight:650}
.group-matches{margin-top:var(--s7)}
.group-matches-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);margin:0 0 var(--s3)}
.group-matches-head h2{font-size:19px;font-weight:640;letter-spacing:-.025em}
.group-matches-head span{color:var(--ink-3);font:600 11px/1 var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------------- bracket ---------------- */
.bracket{
  display:flex;gap:var(--s3);overflow-x:auto;align-items:stretch;
  padding-bottom:var(--s3);scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;
  scrollbar-width:thin;
}
.round{flex:0 0 auto;min-width:172px;scroll-snap-align:start;display:flex;flex-direction:column;gap:8px}
.round>h3{font-size:12px;font-weight:620;color:var(--ink-3);padding-left:2px;letter-spacing:-.005em;flex:0 0 auto}
.round>.ties{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:8px}
.tie{background:var(--surface);border:1px solid var(--line);border-radius:var(--r1);padding:9px 11px;box-shadow:var(--shadow-1)}
.tie[data-state="live"]{border-color:var(--line-2);box-shadow:var(--shadow-2)}
.tie .cap{font-size:11px;color:var(--ink-3);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tie .s{display:flex;justify-content:space-between;gap:8px;padding:2px 0;font-size:14px;letter-spacing:-.012em}
.tie .s span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tie .s span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink-3);flex:0 0 auto}
.tie .s.won{font-weight:660}
.tie .s.lost{color:var(--ink-3)}
.tie .s.tbd{color:var(--ink-3);font-style:normal}

.champ{
  display:flex;align-items:center;gap:var(--s4);padding:var(--s5);margin-bottom:var(--s4);
  background:var(--ink);color:var(--on-ink);border-radius:var(--r2);box-shadow:var(--shadow-2);
  animation:cardIn .5s var(--e-expo) both;
}
.champ svg{width:34px;height:34px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.5}
.champ .t{font-size:12px;opacity:.7;font-weight:520}
.champ .n{font-size:21px;font-weight:660;letter-spacing:-.024em;margin-top:1px}

/* ---------------- tomme tilstander ---------------- */
.blank{text-align:center;padding:var(--s8) var(--s5)}
.blank h2{font-size:17px;margin-bottom:6px}
.blank p{color:var(--ink-2);font-size:14px;max-width:38ch;margin:0 auto var(--s5);line-height:1.5}
.blank .btn{min-width:180px}

/* skjelett */
.sk{background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;animation:sheen 1.4s linear infinite;border-radius:6px;color:transparent}
@keyframes sheen{to{background-position:-200% 0}}

/* ---------------- rader i oppsett ---------------- */
.rows{display:grid;gap:6px}
.row-btn{
  display:flex;align-items:center;gap:var(--s3);width:100%;text-align:left;
  padding:13px var(--s4);background:var(--surface);border:1px solid var(--line);border-radius:var(--r1);
  box-shadow:var(--shadow-1);transition:transform .11s var(--e-out), background-color .16s;
}
.row-btn:active{transform:scale(.99);background:var(--surface-2)}
.row-btn .ico{flex:0 0 auto;width:30px;height:30px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center}
.row-btn .ico svg{width:16px;height:16px;stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.row-btn .tx{flex:1;min-width:0}
.row-btn .tx b{display:block;font-size:14.5px;font-weight:560;letter-spacing:-.012em}
.row-btn .tx small{display:block;font-size:12.5px;color:var(--ink-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-btn .arw{flex:0 0 auto;color:var(--ink-3)}
.row-btn.warn .ico{background:var(--over-w)} .row-btn.warn .ico svg{stroke:var(--over)} .row-btn.warn .tx b{color:var(--over)}

.stats{display:flex;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;background:var(--surface);box-shadow:var(--shadow-1);margin-bottom:var(--s5)}
.stats>div{flex:1;padding:var(--s4) var(--s3);text-align:center;border-right:1px solid var(--line)}
.stats>div:last-child{border-right:0}
.stats b{display:block;font-family:var(--mono);font-size:21px;font-weight:640;letter-spacing:-.04em}
.stats small{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px}

/* ---------------- ark ---------------- */
.scrim{
  position:fixed;inset:0;z-index:var(--z-backdrop);
  background:oklch(0.19 0.014 260 / .42);backdrop-filter:blur(2px);
  display:flex;align-items:flex-end;justify-content:center;
  animation:fadeIn .2s var(--e-out) both;
}
.scrim.out{animation:fadeOut .16s var(--e-out) both}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
.sheet{
  position:relative;z-index:var(--z-sheet);width:100%;max-width:520px;max-height:90dvh;overflow-y:auto;
  background:var(--bg);border-radius:var(--r4) var(--r4) 0 0;
  padding:var(--s5) var(--s5) calc(var(--s6) + env(safe-area-inset-bottom));
  box-shadow:var(--shadow-3);
  animation:sheetIn .34s var(--e-expo) both;
}
.scrim.out .sheet{animation:sheetOut .22s var(--e-out) both}
@keyframes sheetIn{from{transform:translateY(100%)}}
@keyframes sheetOut{to{transform:translateY(100%)}}
@media(min-width:560px){
  .scrim{align-items:center;padding:var(--s5)}
  .sheet{border-radius:var(--r3);animation:dialogIn .28s var(--e-expo) both}
  .scrim.out .sheet{animation:dialogOut .18s var(--e-out) both}
  @keyframes dialogIn{from{opacity:0;transform:translateY(12px) scale(.98)}}
  @keyframes dialogOut{to{opacity:0;transform:scale(.98)}}
  .grip{display:none}
}
.grip{width:36px;height:4px;border-radius:99px;background:var(--line-2);margin:-6px auto var(--s4)}
.sheet h2{font-size:19px;letter-spacing:-.022em}
.sheet .lede{color:var(--ink-2);font-size:13.5px;margin:5px 0 var(--s5);line-height:1.5}
.field{display:block;margin-top:var(--s4)}
.field>span{display:block;font-size:12.5px;font-weight:560;color:var(--ink-2);margin-bottom:6px}
.field>small{display:block;font-size:12px;color:var(--ink-3);margin-top:6px;line-height:1.45}
.team-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.team-slot{display:grid;gap:5px;padding:9px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r1)}
.team-slot>span{font-size:11px;font-weight:620;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team-slot:nth-child(-n+2)>span{color:var(--go)}
.team-slot input{min-width:0;padding:9px 8px;font-size:14px}
.choice{
  display:flex;align-items:center;gap:var(--s3);width:100%;text-align:left;margin-bottom:8px;
  padding:14px var(--s4);background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r2);
  box-shadow:var(--shadow-1);transition:transform .11s var(--e-out), border-color .16s;
}
.choice:active{transform:scale(.985)}
.choice .k{flex:0 0 auto;width:30px;height:30px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-size:13px;font-weight:660;font-family:var(--mono)}
.choice b{display:block;font-size:15px;font-weight:580;letter-spacing:-.014em}
.choice small{display:block;font-size:12.5px;color:var(--ink-3);margin-top:1px}
.choice.accent{border-color:var(--ink)}
.choice.accent .k{background:var(--ink);color:var(--on-ink)}

.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.key{background:var(--surface);border:1px solid var(--line);border-radius:var(--r1);padding:10px 12px}
.key small{display:block;font-size:11px;color:var(--ink-3);font-weight:560}
.key b{display:block;font-size:13.5px;font-weight:560;margin:1px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.012em}
.key i{font-style:normal;font-family:var(--mono);font-size:21px;font-weight:640;letter-spacing:.1em}

/* nedtelling */
.countdown{
  position:fixed;inset:0;z-index:var(--z-count);
  background:color-mix(in oklch, var(--bg) 92%, transparent);backdrop-filter:blur(16px);
  display:grid;place-items:center;text-align:center;padding:var(--s5);
  animation:fadeIn .18s var(--e-out) both;
}
.countdown .vs{font-size:15px;font-weight:560;color:var(--ink-2);letter-spacing:-.01em}
.countdown .n{
  font-family:var(--mono);font-size:min(38vw,150px);font-weight:660;letter-spacing:-.06em;line-height:1;
  margin:var(--s4) 0;color:var(--ink);
}
.countdown .n span{display:block;animation:tickIn .55s var(--e-expo) both}
@keyframes tickIn{from{opacity:0;transform:scale(1.28)}60%{opacity:1}}
.countdown .n.go span{color:var(--go);font-size:.42em;letter-spacing:-.02em}
.countdown .hint{font-size:12.5px;color:var(--ink-3)}

/* toast */
.toasts{position:fixed;left:0;right:0;bottom:calc(86px + env(safe-area-inset-bottom));z-index:var(--z-toast);display:grid;gap:8px;justify-items:center;pointer-events:none;padding:0 var(--s4)}
.toast{
  max-width:min(94vw,440px);padding:11px var(--s4);border-radius:var(--r1);
  background:var(--ink);color:var(--on-ink);font-size:13.5px;font-weight:520;letter-spacing:-.008em;
  box-shadow:var(--shadow-2);animation:toastIn .3s var(--e-expo) both;text-align:center;
}
.toast.out{animation:toastOut .2s var(--e-out) both}
.toast.bad{background:var(--over)}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.96)}}
@keyframes toastOut{to{opacity:0;transform:translateY(6px) scale(.98)}}

/* ---------------- storskjerm ---------------- */
body.tv{padding-bottom:0;overflow:hidden}
body.tv .nav,body.tv .head{display:none}
body.tv main{max-width:none;padding:clamp(14px,2vw,30px);height:100dvh;display:flex;flex-direction:column;gap:0}
body.tv .tvhead{display:flex;align-items:baseline;gap:16px;margin-bottom:clamp(12px,1.6vw,22px)}
body.tv .tvhead h1{font-size:clamp(20px,2.6vw,38px);letter-spacing:-.028em}
body.tv .tvhead .sub{font-size:clamp(12px,1.1vw,16px);color:var(--ink-3)}
body.tv .courts{
  flex:1;min-height:0;
  grid-template-columns:repeat(var(--tvcols,3),1fr);
  grid-auto-rows:1fr;gap:clamp(10px,1.1vw,18px);
}
body.tv .court{display:flex;flex-direction:column;min-height:0}
body.tv .court-body{flex:1;align-items:center}
body.tv .free{display:flex;align-items:center;justify-content:center;flex:1}
body.tv .side b{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.15}
body.tv .sides{gap:6px}
body.tv .court-actions,body.tv .queue-block{display:none}
body.tv .court.overview .court-top{padding:clamp(9px,1vw,15px) clamp(11px,1.2vw,18px)}
body.tv .court.overview .court-top .cap{font-size:clamp(13px,1.15vw,18px);color:var(--ink)}
body.tv .court.overview .court-body{padding:clamp(16px,2vw,34px);gap:clamp(14px,2vw,34px)}
body.tv .court.overview .sides{gap:clamp(8px,.8vw,14px)}
body.tv .court.overview .side b{font-size:clamp(20px,2.2vw,40px);font-weight:640}
body.tv .court.overview .timer .t{font-size:clamp(42px,5.8vw,92px)}
body.tv .court.overview .overview-free{display:grid;place-items:center;flex:1;padding:var(--s5);font-size:clamp(18px,2vw,32px);color:var(--ink-3)}
body.tv .timer .t{font-size:clamp(34px,4.6vw,76px)}
body.tv .side b{font-size:clamp(15px,1.55vw,26px)}
body.tv .court-top .cap{font-size:clamp(11px,.85vw,15px)}
body.tv .track{height:3px}
.tv-exit{position:fixed;top:14px;right:14px;z-index:var(--z-toast);opacity:.35;transition:opacity .2s}
.tv-exit:hover,.tv-exit:focus-visible{opacity:1}
@media(max-width:760px){body.tv .courts{grid-template-columns:1fr 1fr}}
@media(orientation:portrait){body.tv .courts{grid-template-columns:1fr 1fr}}

/* ---------------- redusert bevegelse ---------------- */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important;scroll-behavior:auto !important;
  }
  .scrim,.sheet,.toast,.court.enter,.champ{animation:fadeIn .01ms both !important}
  .countdown .n span{animation:none !important}
}
</style>
</head>
<body>

<!-- ============ INNLOGGING ============ -->
<section class="auth" id="auth" aria-labelledby="authTitle">
  <div class="mark" aria-hidden="true">
    <svg viewBox="0 0 32 32"><rect x="6" y="5" width="6" height="22" rx="1.6" fill="#fff"/><rect x="17" y="12" width="6" height="15" rx="1.6" fill="#58c48a"/></svg>
  </div>
  <h1 id="authTitle">Kilkast</h1>
  <p class="lede">Fire siffer fra arrangøren</p>
  <div class="dots" id="dots" role="status" aria-live="polite" aria-label="Kode"></div>
  <div class="pad-grid" id="keypad"></div>
  <p class="msg" id="authMsg" role="alert"></p>
  <button class="btn ghost block" id="spectate" style="margin-top:20px">Følg med uten kode</button>
</section>

<!-- ============ APP ============ -->
<div id="app" class="hide">
  <header class="head">
    <h1 id="title">Kilkast</h1>
    <button class="who" id="who" type="button"><span class="pip"></span><span id="whoName">Tilskuer</span></button>
  </header>
  <main id="view" tabindex="-1"></main>
  <nav class="nav" id="nav" aria-label="Hovedmeny"></nav>
</div>

<div id="layers"></div>
<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

<script>
/* ================================================================
   KUBBMESTERSKAP
   ================================================================ */
const CFG = {
  url: window.__KUBB_API__ || 'https://rknxxzxywmfkwsvojfiv.supabase.co',
  key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJrbnh4enh5d21ma3dzdm9qZml2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1NjcwMDAsImV4cCI6MjA5MTE0MzAwMH0.OUkx46vuyjUCn0IOoYH6tSvRhSlQvfZ5wS7iXv1l-cg'
};
const sb = supabase.createClient(CFG.url, CFG.key, { auth:{ persistSession:false } });

/* ---------- små hjelpere ---------- */
const $  = s => document.querySelector(s);
const el = (t, c, h) => { const n = document.createElement(t); if(c) n.className = c; if(h != null) n.innerHTML = h; return n; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const buzz = p => { try { navigator.vibrate?.(p); } catch(_){} };
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

const mem = {};
const store = {
  get: k => { try { return localStorage.getItem(k); } catch(_){ return mem[k] ?? null; } },
  set: (k,v) => { try { localStorage.setItem(k,v); } catch(_){ mem[k] = v; } },
  del: k => { try { localStorage.removeItem(k); } catch(_){ delete mem[k]; } }
};

const ICON = {
  courts:  '<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M12 5v14M3 12h2.6M18.4 12H21"/>',
  matches: '<path d="M4 7h16M4 12h16M4 17h9"/>',
  table:   '<path d="M4 19V11M9.5 19V5M15 19v-6M20.5 19v-9"/>',
  playoff: '<path d="M6 4h12v4a6 6 0 0 1-12 0z"/><path d="M18 5.5h2.5V7a3.5 3.5 0 0 1-3 3.4M6 5.5H3.5V7a3.5 3.5 0 0 0 3 3.4"/><path d="M12 14v3M8.5 20h7"/>',
  admin:   '<rect x="5" y="4.5" width="14" height="16" rx="2.4"/><path d="M9.2 4.5V3.2h5.6v1.3"/><path d="M8.8 12.4l2.1 2.1 4.3-4.3"/>',
  cog:     '<path d="M6 20v-6M6 10V4M12 20v-3M12 13V4M18 20v-9M18 7V4"/><path d="M3.6 14h4.8M9.6 17h4.8M15.6 11h4.8"/>',
  people:  '<circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 5.5a3.2 3.2 0 0 1 0 6M17.5 20a6 6 0 0 0-2-4.4"/>',
  key:     '<circle cx="8" cy="12" r="3.6"/><path d="M11.6 12H21M18 12v3.4M15 12v2.4"/>',
  play:    '<path d="M7 4.8v14.4l12-7.2z"/>',
  cup:     '<path d="M6 4h12v4a6 6 0 0 1-12 0z"/><path d="M18 5.5h2.5V7a3.5 3.5 0 0 1-3 3.4M6 5.5H3.5V7a3.5 3.5 0 0 0 3 3.4"/><path d="M12 14v3M8.5 20h7"/>',
  tv:      '<rect x="2.5" y="5" width="19" height="13" rx="2.2"/><path d="M8 21h8"/>',
  trash:   '<path d="M4 6.5h16M9.5 6.5V4.5h5v2M6.5 6.5 7.5 20h9l1-13.5"/>',
  chev:    '<path d="M9 5l7 7-7 7"/>'
};
const svg = (d, s) => `<svg viewBox="0 0 24 24" aria-hidden="true"${s?` style="${s}"`:''}>${d}</svg>`;

/* ---------- tilstand ---------- */
const S = {
  code:null, role:null, teamId:null, teamName:null,
  t:{ name:'Kilkast', match_seconds:2400, num_courts:6, phase:'setup', qualifiers_per_group:2 },
  teams:[], matches:[], standings:[],
  offset:0, tab:'courts', filter:'all', groupView:null, tv:false, ready:false, seenOnCourt:{}
};
const isAdmin = () => S.role === 'admin';
const canAct  = () => S.role === 'admin' || S.role === 'team';
const team    = id => S.teams.find(t => t.id === id);
const tName   = id => (team(id) || {}).name || null;
const svrNow  = () => Date.now() + S.offset;

function clock(sec){
  const neg = sec < 0, n = Math.abs(Math.round(sec));
  return (neg ? '+' : '') + String(Math.floor(n/60)).padStart(2,'0') + ':' + String(n % 60).padStart(2,'0');
}
function elapsed(m){
  if(!m.started_at) return 0;
  let e = (svrNow() - Date.parse(m.started_at)) / 1000 - (m.pause_accum || 0);
  if(m.status === 'paused' && m.paused_at) e -= (svrNow() - Date.parse(m.paused_at)) / 1000;
  return Math.max(0, e);
}
const left = m => S.t.match_seconds - elapsed(m);
function tone(m){
  if(!m || m.status === 'ready') return 'idle';
  if(m.status === 'paused') return 'warn';
  const r = left(m);
  return r <= 0 ? 'over' : r <= 300 ? 'warn' : 'go';
}

/* ---------- toast ---------- */
function toast(msg, bad){
  const n = el('div', 'toast' + (bad ? ' bad' : ''));
  n.textContent = msg;
  $('#toasts').appendChild(n);
  setTimeout(() => { n.classList.add('out'); setTimeout(() => n.remove(), 220); }, 2800);
}

/* ================================================================
   INNLOGGING
   ================================================================ */
let pin = '', pinLock = false;

function paintDots(bad){
  const d = $('#dots');
  d.innerHTML = [0,1,2,3].map(i => `<i class="${i < pin.length ? 'on' : i === pin.length ? 'cur' : ''}"></i>`).join('');
  d.setAttribute('aria-label', `${pin.length} av 4 siffer`);
  if(bad){ d.classList.remove('bad'); void d.offsetWidth; d.classList.add('bad'); }
}
function keypad(){
  const k = $('#keypad');
  ['1','2','3','4','5','6','7','8','9','·','0','⌫'].forEach(v => {
    const b = el('button');
    b.type = 'button';
    if(v === '·'){ b.dataset.empty = '1'; b.tabIndex = -1; b.setAttribute('aria-hidden','true'); }
    else if(v === '⌫'){ b.className = 'text'; b.textContent = 'Slett'; b.setAttribute('aria-label','Slett siste siffer'); b.onclick = () => { if(pin){ pin = pin.slice(0,-1); paintDots(); } }; }
    else { b.textContent = v; b.onclick = () => press(v); }
    k.appendChild(b);
  });
  paintDots();
}
function press(v){
  if(pinLock || pin.length >= 4) return;
  pin += v; buzz(8); paintDots();
  if(pin.length === 4) setTimeout(() => submitPin(), 120);
}
async function submitPin(){
  if(pinLock) return;
  pinLock = true;
  $('#authMsg').textContent = '';
  let data = null, err = null;
  try { const r = await sb.rpc('kubb_login', { p_code: pin }); data = r.data; err = r.error; }
  catch(e){ err = e; }
  if(err){
    $('#authMsg').textContent = 'Får ikke kontakt. Sjekk nettet og prøv igjen.';
    pin = ''; pinLock = false; paintDots(true); return;
  }
  if(!data || !data.ok){
    $('#authMsg').textContent = 'Ukjent kode. Sjekk med arrangøren.';
    buzz([30,50,30]); pin = ''; pinLock = false; paintDots(true); return;
  }
  S.code = pin; S.role = data.role; S.teamId = data.team_id; S.teamName = data.team_name;
  store.set('kubb.code', pin);
  await boot();
}
function signOut(){ store.del('kubb.code'); location.reload(); }

/* ================================================================
   DATA
   ================================================================ */
async function pullAll(){
  const previousMatches = S.matches;
  const [c, t, tm, mt, st] = await Promise.all([
    sb.rpc('kubb_now'),
    sb.from('kubb_tournament').select('*').eq('id',1).maybeSingle(),
    sb.from('kubb_teams').select('*'),
    sb.from('kubb_matches').select('*').order('order_no'),
    sb.from('kubb_standings').select('*')
  ]);
  if(c.data) S.offset = Date.parse(c.data) - Date.now();
  if(t.data) S.t = t.data;
  S.teams = tm.data || [];
  S.matches = mt.data || [];
  S.standings = st.data || [];
  announceNewCourtAssignments(previousMatches);
  S.ready = true;
}
let pending = null;
function nudge(){
  clearTimeout(pending);
  pending = setTimeout(async () => { await pullAll(); paint(); }, 240);
}
function listen(){
  sb.channel('kubb-live')
    .on('postgres_changes', { event:'*', schema:'public', table:'kubb_matches' }, nudge)
    .on('postgres_changes', { event:'*', schema:'public', table:'kubb_teams' }, nudge)
    .on('postgres_changes', { event:'*', schema:'public', table:'kubb_tournament' }, nudge)
    .subscribe();
}
async function rpc(fn, args, done){
  if(!canAct()){ toast('Du trenger en kode for å gjøre dette', true); return false; }
  const { data, error } = await sb.rpc(fn, Object.assign({ p_code: S.code }, args));
  if(error){ toast(String(error.message || error).replace(/^.*?:\s*/, ''), true); return false; }
  await pullAll(); paint();
  if(done) toast(done);
  return data ?? true;
}

async function boot(){
  $('#auth').classList.add('hide');
  $('#app').classList.remove('hide');
  await pullAll();
  buildNav(); paint(); listen();
  setInterval(beat, 250);
  setInterval(finishExpiredMatches, 10000);
  finishExpiredMatches();
  setInterval(async () => { const { data } = await sb.rpc('kubb_now'); if(data) S.offset = Date.parse(data) - Date.now(); }, 60000);
  setInterval(async () => { await pullAll(); paint(); }, 25000);
}

/* ---------- varsler ---------- */
const notificationsEnabled = () => 'Notification' in window && Notification.permission === 'granted' && store.get('kubb.notifications') === 'on';
function sendNotification(title, body){
  if(!notificationsEnabled()) return;
  try { new Notification(title, { body, tag:`kubb-${title}-${body}`, renotify:false }); } catch(_){}
}
async function enableNotifications(){
  if(!('Notification' in window)){ toast('Denne nettleseren støtter ikke varsler', true); return; }
  if(Notification.permission === 'denied'){ toast('Varsler er slått av i nettleserens innstillinger', true); return; }
  const permission = await Notification.requestPermission();
  if(permission === 'granted'){
    store.set('kubb.notifications', 'on');
    toast('Varsler er på — du får beskjed når laget ditt får bane');
  } else toast('Varsler ble ikke slått på', true);
  paint();
}
function announceNewCourtAssignments(previous){
  if(!notificationsEnabled() || !previous.length) return;
  const before = new Map(previous.map(m => [m.id, m]));
  S.matches.filter(m => m.status === 'ready' && m.court).forEach(m => {
    const old = before.get(m.id);
    if(old && old.status === 'ready' && old.court === m.court) return;
    const a = tName(m.team_a) || '?', b = tName(m.team_b) || '?';
    if(S.role === 'team' && (m.team_a === S.teamId || m.team_b === S.teamId))
      sendNotification('Din kamp er klar', `${a} – ${b} på bane ${m.court}`);
    else if(isAdmin())
      sendNotification(`Bane ${m.court} er klar`, `${a} – ${b}`);
  });
}
function notificationButton(){
  if(S.tv || S.role === 'guest' || !('Notification' in window)) return '';
  const enabled = notificationsEnabled();
  return `<button class="btn ${enabled ? 'quiet' : 'ghost'} sm" data-do="notify">${enabled ? 'Varsler er på' : 'Varsle meg når det er vår tur'}</button>`;
}

// Denne ligger øverst i appen helt til laget er ferdig på banen. Den virker
// uten at nettleservarsler er slått på, så laget ser beskjeden når siden åpnes.
function teamTurnNotice(){
  if(!S.teamId || S.tv) return '';
  const m = S.matches.find(x => ['ready','live','paused'].includes(x.status) && (x.team_a === S.teamId || x.team_b === S.teamId));
  if(!m || !m.court) return '';
  const rival = m.team_a === S.teamId ? tName(m.team_b) : tName(m.team_a);
  const state = m.status === 'ready' ? 'ready' : m.status === 'live' ? 'live' : 'paused';
  const title = m.status === 'ready' ? `Dere skal til bane ${m.court} nå` : m.status === 'live' ? `Dere spiller på bane ${m.court}` : `Kampen på bane ${m.court} er pauset`;
  return `<aside class="turn-call" data-state="${state}" role="status" aria-live="assertive">
    <span class="turn-mark">${m.status === 'ready' ? 'Nå' : 'Bane ' + m.court}</span>
    <span><b>${esc(title)}</b><small>${esc(S.teamName)}${rival ? ` mot ${esc(rival)}` : ''}</small></span>
  </aside>`;
}

let wakeLock = null;
const keepAwake = () => store.get('kubb.keep-awake') === 'on';
async function toggleWakeLock(){
  if(!navigator.wakeLock){ toast('Denne nettleseren støtter ikke skjermlås', true); return; }
  if(wakeLock){
    await wakeLock.release(); wakeLock = null; store.del('kubb.keep-awake'); toast('Skjermen kan slås av som normalt'); paint(); return;
  }
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; paint(); });
    store.set('kubb.keep-awake', 'on'); toast('Skjermen holdes våken'); paint();
  } catch(_){ toast('Kunne ikke holde skjermen våken', true); }
}
async function restoreWakeLock(){
  if(keepAwake() && !wakeLock && document.visibilityState === 'visible'){
    try { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; paint(); }); } catch(_){}
  }
}
document.addEventListener('visibilitychange', restoreWakeLock);
function wakeLockButton(){
  if(S.tv || !('wakeLock' in navigator)) return '';
  return `<button class="btn ${keepAwake() ? 'quiet' : 'ghost'} sm" data-do="awake">${keepAwake() ? 'Skjerm holdes våken' : 'Hold skjermen våken'}</button>`;
}

let finishingExpired = false;
async function finishExpiredMatches(){
  if(finishingExpired || !canAct() || !S.code) return;
  finishingExpired = true;
  try {
    const { data } = await sb.rpc('kubb_finish_expired_matches', { p_code:S.code });
    if(data > 0){ await pullAll(); paint(); toast(data === 1 ? 'Tiden er ute — kampen ble uavgjort' : `${data} kamper ble uavgjort da tiden gikk ut`); }
  } finally { finishingExpired = false; }
}

/* ================================================================
   NAVIGASJON
   ================================================================ */
const TABS = [
  { id:'courts',  label:'Baner',      icon:ICON.courts },
  { id:'groups',  label:'Puljer',     icon:ICON.table },
  { id:'playoff', label:'Sluttspill', icon:ICON.playoff },
  { id:'admin',   label:'Arrangør',   icon:ICON.admin }
];
function buildNav(){
  const tabs = TABS.filter(t => t.id !== 'admin' || isAdmin());
  const n = $('#nav');
  n.style.setProperty('--n', tabs.length);
  n.innerHTML = tabs.map(t =>
    `<button type="button" data-tab="${t.id}"${S.tab === t.id ? ' aria-current="page"' : ''}>${svg(t.icon)}<span>${t.label}</span></button>`
  ).join('');
  n.querySelectorAll('button').forEach(b => b.onclick = () => go(b.dataset.tab));
}
function go(tab){
  if(S.tab === tab) { window.scrollTo({ top:0, behavior: reduced() ? 'auto' : 'smooth' }); return; }
  S.tab = tab; buildNav(); paint(); window.scrollTo(0,0);
}

/* ================================================================
   RENDER
   ================================================================ */
function paint(){
  $('#title').textContent = S.t.name || 'Kilkast';
  document.title = (S.t.name || 'Kilkast');
  const who = $('#who');
  who.dataset.role = S.role;
  $('#whoName').textContent = S.role === 'admin' ? (S.teamName ? `${S.teamName} · arrangør` : 'Arrangør') : S.role === 'team' ? (S.teamName || 'Lag') : 'Tilskuer';
  who.setAttribute('aria-label', S.role === 'guest' ? 'Logg inn med kode' : 'Logg ut');
  who.onclick = () => S.role === 'guest' ? location.reload() : askSignOut();

  const v = $('#view');
  v.innerHTML = teamTurnNotice() + (
    S.tab === 'courts'  ? viewCourts()  :
    S.tab === 'groups'  ? viewGroups()  :
    S.tab === 'playoff' ? viewPlayoff() : viewAdmin()
  );
  wire();
  beat();
}

function wire(){
  document.querySelectorAll('.bracket').forEach(br => br.classList.toggle('ends', br.scrollWidth <= br.clientWidth + 4));
  $('#view').querySelectorAll('[data-do]').forEach(n => n.onclick = () => {
    const a = n.dataset.do, id = n.dataset.id;
    ({
      start:   () => countdown(id),
      pause:   () => rpc('kubb_pause_match',  { p_match:id }),
      resume:  () => rpc('kubb_resume_match', { p_match:id }),
      finish:  () => sheetResult(id),
      edit:    () => sheetResult(id, true),
      reopen:  () => rpc('kubb_reopen_match', { p_match:id }, 'Kampen er åpnet igjen'),
      advance: () => rpc('kubb_admin_advance_tournament', {}, 'Turneringen er oppdatert'),
      choose:  () => sheetChooseCourt(Number(n.dataset.court)),
      notify:  () => enableNotifications(),
      awake:   () => toggleWakeLock(),
      filter:  () => { S.filter = id; paint(); },
      group:   () => { S.groupView = id; paint(); },
      teamMatches: () => sheetTeamMatches(id),
      tv:      () => bigScreen(!S.tv),
      keys:    () => sheetKeys(),
      teams:   () => sheetTeams(),
      setup:   () => sheetSetup(),
      begin:   () => ask('Trekk grupper?',
                  'Lagene trekkes tilfeldig i fire puljer. A- og B-sluttspilltrærne blir synlige med én gang.',
                  'Trekk grupper', () => rpc('kubb_admin_generate_groups', {}, 'Puljene er trukket — gruppespillet og sluttspilltrærne er klare')),
      wipe:    () => ask('Nullstille alt?', 'Lag, koder, kamper og resultater slettes. Dette kan ikke angres.',
                  'Slett alt', () => rpc('kubb_admin_reset', {}, 'Alt er nullstilt'), true),
      out:     () => askSignOut()
    }[a] || (()=>{}))();
  });
  $('#view').querySelectorAll('tr[data-do]').forEach(row => row.onkeydown = e => {
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); row.click(); }
  });
}

/* ---------- baner ---------- */
const onCourt = c => S.matches.find(m => m.court === c && ['ready','live','paused'].includes(m.status));
function nextForCourt(c, current){
  const busy = new Set();
  S.matches.filter(m => ['ready','live','paused'].includes(m.status) && m.id !== current?.id).forEach(m => {
    if(m.team_a) busy.add(m.team_a);
    if(m.team_b) busy.add(m.team_b);
  });
  return S.matches
    .filter(m => m.status === 'queued' && m.team_a && m.team_b && !busy.has(m.team_a) && !busy.has(m.team_b))
    .sort((a,b) => (a.order_no || 0) - (b.order_no || 0))[0] || null;
}
function nextHint(c, current){
  const m = nextForCourt(c, current);
  if(!m) return '';
  const mine = m.team_a === S.teamId || m.team_b === S.teamId;
  return `<div class="court-next">Neste: <b>${esc(tName(m.team_a) || '?')} – ${esc(tName(m.team_b) || '?')}</b>${mine ? ' · ditt lag' : ''}</div>`;
}

function viewCourts(){
  const n = S.t.num_courts || 6;
  if(!S.matches.length){
    return blank('Ingen kamper ennå',
      isAdmin() ? 'Legg inn lagene og sett opp gruppespillet, så fyller banene seg selv.'
                : 'Arrangøren har ikke satt opp kampene ennå. Siden oppdaterer seg av seg selv.',
      isAdmin() ? `<button class="btn primary" data-do="teams">Legg inn lag</button>` : '');
  }
  let h = '';
  h += S.tv ? '' : notificationButton() + wakeLockButton() + `<button class="btn quiet sm" data-do="tv" aria-pressed="false">Kun oversikt</button>`;
  if(S.tv){
    const cols = n <= 2 ? n : n <= 4 ? 2 : n <= 9 ? 3 : n <= 16 ? 4 : 5;
    document.body.style.setProperty('--tvcols', cols);
  }
  const order = [];
  for(let c = 1; c <= n; c++) order.push(c);
  h += `<div class="courts">`;
  order.forEach(c => { h += courtCard(c, onCourt(c)); });
  h += `</div>`;

  const queue = S.matches.filter(m => m.status === 'queued' && m.team_a && m.team_b).slice(0,5);
  if(queue.length){
    h += `<div class="queue-block"><div class="eyebrow">Neste ut <small>${queue.length} av ${S.matches.filter(m => m.status === 'queued').length} i kø</small></div>
      <div class="list">${queue.map(matchRow).join('')}</div></div>`;
  }
  return h;
}

function courtCard(c, m){
  if(S.tv) return overviewCourtCard(c, m);
  if(!m){
    return `<article class="court" data-state="free">
      <div class="court-top"><span class="court-no">${c}</span><span class="cap">Bane ${c}</span></div>
      <div class="free">Ledig — neste kamp settes hit automatisk</div></article>`;
  }
  const a = tName(m.team_a) || m.source_a || '?';
  const b = tName(m.team_b) || m.source_b || '?';
  const mine = m.team_a === S.teamId || m.team_b === S.teamId;
  const running = m.status === 'live' || m.status === 'paused';
  const fresh = S.seenOnCourt[c] !== m.id;
  S.seenOnCourt[c] = m.id;

  let actions = '';
  if(!S.tv && canAct()){
    if(m.status === 'ready')
      actions = `<button class="btn primary" data-do="start" data-id="${m.id}">${svg(ICON.play,'width:15px;height:15px;fill:currentColor;stroke:none')}Start kampen</button>` +
        (isAdmin() ? `<button class="btn quiet" data-do="choose" data-court="${c}">Annen kamp</button>` : '');
    else if(m.status === 'live')
      actions = `<button class="btn quiet" data-do="pause" data-id="${m.id}">Pause</button>
                 <button class="btn primary" data-do="finish" data-id="${m.id}">Avslutt</button>`;
    else
      actions = `<button class="btn quiet" data-do="resume" data-id="${m.id}">Fortsett</button>
                 <button class="btn primary" data-do="finish" data-id="${m.id}">Avslutt</button>`;
  }
  return `<article class="court${fresh && !S.tv ? ' enter' : ''}" id="c-${m.id}" data-state="${running ? 'live' : 'ready'}" data-tone="idle">
    <div class="court-top">
      <span class="court-no">${c}</span>
      <span class="cap">${esc(m.label || 'Kamp')}</span>
      ${mine ? `<span class="mine-tag">Ditt lag</span>` : ''}
      ${m.status === 'ready' ? `<span class="new-tag">Ny kamp</span>` : ''}
      ${m.status === 'live' ? `<span class="live-pip" aria-hidden="true"></span>` : ''}
    </div>
    <div class="court-body">
      <div class="sides">
        <div class="side"><b>${esc(a)}</b></div>
        <div class="side"><b>${esc(b)}</b></div>
      </div>
      <div class="timer" data-timer="${m.id}" data-tone="idle">
        <div class="t num">${clock(S.t.match_seconds)}</div>
        <div class="lab">Ny kamp klar</div>
      </div>
    </div>
    <div class="track"><i data-track="${m.id}"></i></div>
    ${nextHint(c, m)}
    ${actions ? `<div class="court-actions">${actions}</div>` : ''}
  </article>`;
}

function overviewCourtCard(c, m){
  if(!m){
    return `<article class="court overview" data-state="free">
      <div class="court-top"><span class="court-no">${c}</span><span class="cap">Bane ${c}</span></div>
      <div class="overview-free">Ledig bane</div></article>`;
  }
  const a = tName(m.team_a) || m.source_a || '?';
  const b = tName(m.team_b) || m.source_b || '?';
  const running = m.status === 'live' || m.status === 'paused';
  return `<article class="court overview" id="c-${m.id}" data-state="${running ? 'live' : 'ready'}" data-tone="idle">
    <div class="court-top"><span class="court-no">${c}</span><span class="cap">Bane ${c}</span></div>
    <div class="court-body">
      <div class="sides"><div class="side"><b>${esc(a)}</b></div><div class="side"><b>${esc(b)}</b></div></div>
      <div class="timer" data-timer="${m.id}" data-tone="idle"><div class="t num">${clock(S.t.match_seconds)}</div></div>
    </div>
  </article>`;
}

/* live-klokke: oppdaterer tekst, ikke DOM-struktur */
function beat(){
  document.querySelectorAll('[data-timer]').forEach(node => {
    const m = S.matches.find(x => x.id === node.dataset.timer);
    if(!m) return;
    const total = S.t.match_seconds;
    let txt, lab, frac, tn;
    if(m.status === 'ready'){ txt = clock(total); lab = 'Ny kamp klar'; frac = 1; tn = 'idle'; }
    else {
      const r = left(m);
      txt = clock(r); frac = Math.max(0, Math.min(1, r / total)); tn = tone(m);
      lab = m.status === 'paused' ? 'Pauset'
          : r <= 0   ? 'Tiden er ute'
          : r <= 300 ? 'Siste 5 min'
          : 'Spilles nå';
    }
    const t = node.querySelector('.t'); if(t.textContent !== txt) t.textContent = txt;
    const l = node.querySelector('.lab'); if(l && l.textContent !== lab) l.textContent = lab;
    node.dataset.tone = tn;
    const card = document.getElementById('c-' + m.id); if(card) card.dataset.tone = tn;
    const bar = document.querySelector(`[data-track="${m.id}"]`); if(bar) bar.style.transform = `scaleX(${frac})`;
  });
  document.querySelectorAll('[data-tick]').forEach(node => {
    const m = S.matches.find(x => x.id === node.dataset.tick);
    if(m) node.textContent = clock(left(m));
  });
}

/* ---------- nedtelling før start ---------- */
function countdown(id){
  const m = S.matches.find(x => x.id === id); if(!m) return;
  const a = tName(m.team_a) || '?', b = tName(m.team_b) || '?';
  const layer = el('div', 'countdown');
  layer.setAttribute('role', 'dialog');
  layer.setAttribute('aria-label', 'Nedtelling');
  layer.innerHTML = `<div>
      <div class="vs">${esc(a)} &nbsp;mot&nbsp; ${esc(b)}</div>
      <div class="n" id="cdN"><span>3</span></div>
      <div class="hint">Trykk hvor som helst for å avbryte</div>
    </div>`;
  $('#layers').appendChild(layer);

  let n = 3, dead = false;
  const kill = () => { if(!dead){ dead = true; clearInterval(iv); layer.remove(); } };
  layer.onclick = kill;
  const slot = layer.querySelector('#cdN');
  buzz(12);
  const iv = setInterval(() => {
    n--;
    if(dead) return;
    buzz(n > 0 ? 12 : [18,40,18]);
    if(n > 0){ slot.className = 'n'; slot.innerHTML = `<span>${n}</span>`; }
    else if(n === 0){ slot.className = 'n go'; slot.innerHTML = `<span>KJØR</span>`; }
    else { dead = true; clearInterval(iv); layer.remove(); rpc('kubb_start_match', { p_match:id }); }
  }, 850);
}

/* ---------- kamprad ---------- */
const STAGE = {
  group:'Første gruppespill', a_group:'A-gruppespill', b_group:'B-gruppespill',
  r16:'Åttendedelsfinaler', qf:'Kvartfinaler', sf:'Semifinaler', final:'Finale', bronze:'Bronsefinale'
};
const isGroupStage = stage => ['group','a_group','b_group'].includes(stage);
function stageName(stage){
  const pool = stage && stage.match(/^([ab])_(r\d+|qf|sf|final|bronze)$/);
  if(pool) return `${pool[1].toUpperCase()}-sluttspill · ${STAGE[pool[2]] || pool[2]}`;
  return STAGE[stage] || stage || 'Kamp';
}
function matchSection(m){
  const prefix = stageName(m.stage);
  return isGroupStage(m.stage) ? `${prefix} · pulje ${m.grp} · runde ${m.round}` : prefix;
}

function matchRow(m){
  const a = tName(m.team_a) || m.source_a || 'Ikke avgjort';
  const b = tName(m.team_b) || m.source_b || 'Ikke avgjort';
  const done = m.status === 'finished';
  const aw = done && m.result === 'a', bw = done && m.result === 'b';
  const mine = m.team_a === S.teamId || m.team_b === S.teamId;

  let chip;
  if(m.status === 'live')        chip = `<span class="chip live num" data-tick="${m.id}">--:--</span>`;
  else if(m.status === 'paused') chip = `<span class="chip ready">Pauset</span>`;
  else if(m.status === 'ready')  chip = `<span class="chip ready">Bane ${m.court}</span>`;
  else if(done)                  chip = `<span class="chip">${m.result === 'draw' ? 'Uavgjort' : 'Ferdig'}</span>`;
  else                           chip = `<span class="chip">I kø</span>`;

  const bits = [m.label || '', m.court ? `bane ${m.court}` : '', mine ? 'ditt lag' : ''].filter(Boolean);
  return `<article class="mrow${done ? ' settled' : ''}">
    <div class="sides">
      <div class="side ${aw ? 'won' : bw ? 'lost' : ''}"><b>${esc(a)}</b></div>
      <div class="side ${bw ? 'won' : aw ? 'lost' : ''}"><b>${esc(b)}</b></div>
      <div class="meta">${esc(bits.join(' · '))}</div>
    </div>
    ${chip}
    ${isAdmin() && done ? `<button class="btn sm quiet" data-do="edit" data-id="${m.id}">Endre</button>` : ''}
  </article>`;
}

function viewMatches(){
  if(!S.matches.length) return blank('Ingen kamper ennå', 'Kampene dukker opp her så snart arrangøren har satt opp gruppespillet.');
  const opts = [['all','Alle'], ['mine','Mine'], ['open','Igjen'], ['done','Spilt']];
  let rows = S.matches.slice();
  if(S.filter === 'mine') rows = rows.filter(m => m.team_a === S.teamId || m.team_b === S.teamId);
  if(S.filter === 'open') rows = rows.filter(m => m.status !== 'finished');
  if(S.filter === 'done') rows = rows.filter(m => m.status === 'finished');

  let h = `<div class="seg" role="group" aria-label="Filter">` + opts.map(([id,l]) =>
    `<button type="button" data-do="filter" data-id="${id}" aria-pressed="${S.filter === id}">${l}</button>`).join('') + `</div>`;

  if(!rows.length){
    h += blank(S.filter === 'mine' ? 'Ingen kamper på deg' : 'Ingenting her',
      S.filter === 'mine' ? (S.teamId ? 'Du har ingen kamper som passer filteret.' : 'Logg inn med lagkoden din for å se bare dine kamper.') : 'Prøv et annet filter.');
    return h;
  }
  const buckets = {};
  rows.forEach(m => {
    const k = matchSection(m);
    (buckets[k] = buckets[k] || []).push(m);
  });
  for(const k in buckets){
    const done = buckets[k].filter(m => m.status === 'finished').length;
    h += `<div class="eyebrow">${esc(k)} <small>${done}/${buckets[k].length} spilt</small></div>
          <div class="list">${buckets[k].map(matchRow).join('')}</div>`;
  }
  return h;
}

/* ---------- puljer og kamper ---------- */
function viewGroups(){
  if(!S.standings.length) return blank('Ingen lag ennå',
    isAdmin() ? 'Legg inn lagene, så bygger tabellen seg selv etter hvert som resultatene kommer inn.' : 'Tabellen fylles ut når lagene er lagt inn.',
    isAdmin() ? `<button class="btn primary" data-do="teams">Legg inn lag</button>` : '');
  const groups = [...new Set(S.standings.map(s => `${s.stage || 'group'}|${s.grp}`))].sort();
  const selected = groups.includes(S.groupView) ? S.groupView : groups[0];
  S.groupView = selected;
  const [stage, g] = selected.split('|');
  const rows = S.standings
    .filter(s => (s.stage || 'group') === stage && s.grp === g)
    .sort((x,y) => x.pos - y.pos);
  const matches = S.matches
    .filter(m => m.stage === stage && String(m.grp) === String(g))
    .sort((a,b) => (a.round || 0) - (b.round || 0) || (a.order_no || 0) - (b.order_no || 0));
  const finished = matches.filter(m => m.status === 'finished').length;
  const groupLabel = `Gruppe ${g}`;
  const tabLabel = key => {
    const [tabStage, tabGroup] = key.split('|');
    return tabStage === 'group' ? `Gruppe ${tabGroup}` : `${stageName(tabStage).replace('gruppespill','spill')} · ${tabGroup}`;
  };
  return `
    <div class="group-tabs" role="navigation" aria-label="Velg gruppe">
      ${groups.map(key => `<button type="button" data-do="group" data-id="${esc(key)}"${key === selected ? ' aria-current="page"' : ''}>${esc(tabLabel(key))}</button>`).join('')}
    </div>
    <section aria-labelledby="group-title">
      <header class="group-header">
        <div><div class="eyebrow">${esc(stageName(stage))} <small>${rows.length} lag</small></div><h2 id="group-title">${esc(groupLabel)}</h2></div>
        <span class="group-count">${finished}/${matches.length} spilt</span>
      </header>
      <div class="group-board"><div class="tw"><table>
        <caption>Stillingen i ${esc(groupLabel)}</caption>
        <thead><tr><th>#</th><th>Lag</th><th>K</th><th>S</th><th>U</th><th>T</th><th>P</th></tr></thead>
        <tbody>${rows.map(r => `<tr class="${stage === 'group' && r.pos <= 2 ? 'leading' : ''} ${r.team_id === S.teamId ? 'self' : ''}">
          <td>${r.pos}</td><td>${esc(r.name)}</td><td>${r.played}</td><td>${r.wins}</td><td>${r.draws}</td><td>${r.losses}</td><td>${r.points}</td>
        </tr>`).join('')}</tbody></table></div></div>
    </section>
    <section class="group-matches" aria-labelledby="group-matches-title">
      <header class="group-matches-head"><h2 id="group-matches-title">Kamper i ${esc(groupLabel)}</h2><span>${matches.length} kamper</span></header>
      ${matches.length ? `<div class="list">${matches.map(matchRow).join('')}</div>` : blank('Ingen kamper satt opp', 'Kampene for denne gruppen vises her så snart trekningen er gjennomført.')}
    </section>
    <p class="legend">K kamper · S seire · U uavgjort · T tap · P poeng. De to beste fra hver første pulje går til A-puljen; resten går til B-puljen.</p>`;
  let h = '';
  groups.forEach(key => {
    const [stage, g] = key.split('|');
    const rows = S.standings.filter(s => (s.stage || 'group') === stage && s.grp === g).sort((x,y) => x.pos - y.pos);
    h += `<div class="eyebrow">${esc(stageName(stage))} · pulje ${esc(g)} <small>${rows.length} lag</small></div>
      <div class="panel pad"><div class="tw"><table>
        <thead><tr><th>#</th><th>Lag</th><th>K</th><th>S</th><th>U</th><th>T</th><th>P</th></tr></thead>
        <tbody>${rows.map(r => `<tr class="stand-click ${stage === 'group' && r.pos <= 2 ? 'through' : ''} ${r.team_id === S.teamId ? 'self' : ''}" data-do="teamMatches" data-id="${r.team_id}" role="button" tabindex="0" aria-label="Se kamper for ${esc(r.name)}">
          <td>${r.pos}</td><td>${esc(r.name)}</td><td>${r.played}</td><td>${r.wins}</td><td>${r.draws}</td><td>${r.losses}</td><td>${r.points}</td>
        </tr>`).join('')}</tbody></table></div></div>`;
  });
  h += `<p class="legend">Trykk på et lag for å se spilte kamper og hva som kommer. K kamper · S seire · U uavgjort · T tap · P poeng. De to beste fra hver første pulje går til A-puljen; resten går til B-puljen.</p>`;
  return h;
}

/* ---------- sluttspill ---------- */
function viewPlayoff(){
  const po = S.matches.filter(m => /^[ab]_(r\d+|qf|sf|final|bronze)$/.test(m.stage));
  if(!po.length){
    const rest = S.matches.filter(m => m.stage === 'group' && m.status !== 'finished').length;
    const finalRest = S.matches.filter(m => ['a_group','b_group'].includes(m.stage) && m.status !== 'finished').length;
    return blank('Sluttspillet er ikke satt opp',
      rest ? `${rest} kamper gjenstår i første gruppespill.`
           : finalRest ? `${finalRest} kamper gjenstår i A- og B-gruppespillet.`
           : 'Begge gruppespill er ferdige. Utslagstrærne settes opp automatisk.',
      isAdmin() && !rest ? `<button class="btn primary" data-do="advance">Gå videre nå</button>` : '');
  }
  const order = ['r16','qf','sf','final','bronze'];
  let h = '';
  ['a','b'].forEach(pool => {
    const poolMatches = po.filter(m => m.stage.startsWith(pool + '_'));
    if(!poolMatches.length) return;
    const fin = poolMatches.find(m => m.stage === `${pool}_final` && m.status === 'finished');
    if(fin){
      const w = fin.result === 'a' ? tName(fin.team_a) : tName(fin.team_b);
      h += `<div class="champ">${svg(ICON.cup)}<div><div class="t">Vinner av ${pool.toUpperCase()}-sluttspill</div><div class="n">${esc(w || '')}</div></div></div>`;
    }
    h += `<div class="eyebrow">${pool.toUpperCase()}-sluttspill</div><div class="bracket" id="bracket-${pool}">` +
      order.filter(s => poolMatches.some(m => m.stage === `${pool}_${s}`)).map(s => `
        <section class="round"><h3>${esc(STAGE[s] || s)}</h3><div class="ties">` +
        poolMatches.filter(m => m.stage === `${pool}_${s}`).sort((a,b) => (a.slot||0) - (b.slot||0)).map(m => {
          const a = tName(m.team_a), b = tName(m.team_b), done = m.status === 'finished';
          const aw = done && m.result === 'a', bw = done && m.result === 'b';
          const running = ['live','paused','ready'].includes(m.status);
          const cap = [m.label, m.court ? `bane ${m.court}` : '', m.status === 'live' ? 'spilles nå' : ''].filter(Boolean).join(' · ');
          const row = (name, src, won, lost) => `<div class="s ${won ? 'won' : lost ? 'lost' : ''} ${name ? '' : 'tbd'}"><span>${esc(name || src || '–')}</span></div>`;
          return `<article class="tie" data-state="${running ? 'live' : ''}"><div class="cap">${esc(cap)}</div>${row(a, m.source_a, aw, done && bw)}${row(b, m.source_b, bw, done && aw)}</article>`;
        }).join('') + `</div></section>`).join('') + `</div>`;
  });
  return h;
}

   ================================================================ */
let openSheets = 0;
function sheet(html){
  const scrim = el('div', 'scrim');
  scrim.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grip"></div>${html}</div>`;
  const box = scrim.firstElementChild;
  const prev = document.activeElement;
  openSheets++;
  document.body.style.overflow = 'hidden';

  const close = () => {
    scrim.classList.add('out');
    setTimeout(() => {
      scrim.remove();
      if(--openSheets <= 0){ openSheets = 0; document.body.style.overflow = ''; }
      prev?.focus?.();
    }, reduced() ? 10 : 200);
    document.removeEventListener('keydown', onKey);
  };
  const onKey = e => {
    if(e.key === 'Escape'){ e.preventDefault(); close(); return; }
    if(e.key !== 'Tab') return;
    const f = box.querySelectorAll('button,input,textarea,select,[href],[tabindex]:not([tabindex="-1"])');
    if(!f.length) return;
    const first = f[0], last = f[f.length-1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  };
  scrim.onclick = e => { if(e.target === scrim) close(); };
  document.addEventListener('keydown', onKey);
  $('#layers').appendChild(scrim);
  setTimeout(() => box.querySelector('button,input,textarea')?.focus({ preventScroll:true }), 60);
  return { box, close };
}

function ask(title, body, cta, fn, danger){
  const { box, close } = sheet(`<h2>${esc(title)}</h2><p class="lede">${esc(body)}</p>
    <div class="cluster"><button class="btn" data-x="no">Avbryt</button>
    <button class="btn ${danger ? 'danger' : 'primary'}" data-x="yes">${esc(cta)}</button></div>`);
  box.querySelector('[data-x="no"]').onclick = close;
  box.querySelector('[data-x="yes"]').onclick = () => { close(); fn(); };
}
function askSignOut(){
  ask('Logge ut?', S.role === 'admin' ? 'Du må skrive inn arrangørkoden igjen for å komme tilbake.' : 'Du må skrive inn lagkoden igjen for å komme tilbake.', 'Logg ut', signOut);
}

function sheetResult(id, editing = false){
  const m = S.matches.find(x => x.id === id); if(!m) return;
  const a = tName(m.team_a) || '?', b = tName(m.team_b) || '?';
  const r = left(m);
  const status = editing ? 'Endringen oppdaterer tabellen med én gang.' : m.status === 'paused' ? 'Kampen er pauset' : r <= 0 ? `Tiden gikk ut for ${clock(-r).replace('+','')} siden` : `${clock(r)} igjen av kampen`;
  const { box, close } = sheet(`
    <h2>${editing ? 'Endre resultat' : 'Hvem vant?'}</h2>
    <p class="lede">${esc(m.label || 'Kamp')} · ${esc(status)}</p>
    <button class="choice accent" data-r="a"><span><b>${esc(a)}</b><small>3 poeng</small></span></button>
    <button class="choice accent" data-r="b"><span><b>${esc(b)}</b><small>3 poeng</small></span></button>
    ${isGroupStage(m.stage) ? `<button class="choice" data-r="draw"><span><b>Uavgjort</b><small>1 poeng til hvert lag</small></span></button>` : ''}
    <div style="margin-top:20px"><button class="btn ghost block" data-x="cancel">Avbryt</button></div>`);

  box.querySelectorAll('[data-r]').forEach(btn => btn.onclick = () => {
    const res = btn.dataset.r;
    close();
    rpc(editing ? 'kubb_admin_correct_result' : 'kubb_finish_match', { p_match:id, p_result:res }, editing ? 'Resultatet er oppdatert' : 'Resultat lagret — ny kamp settes på banen');
  });
  box.querySelector('[data-x="cancel"]').onclick = close;
}

function sheetChooseCourt(court){
  const choices = S.matches.filter(m => m.status === 'queued' && m.team_a && m.team_b);
  if(!choices.length){ toast('Ingen andre startklare kamper i køen', true); return; }
  const { box, close } = sheet(`
    <h2>Velg kamp til bane ${court}</h2>
    <p class="lede">Velg en uspilt kamp dersom kampen som står klar ikke kan starte. Den opprinnelige kampen går tilbake i køen.</p>
    <div class="list">${choices.map(m => `<button class="row-btn" data-pick="${m.id}">
      <span class="tx"><b>${esc(tName(m.team_a) || '?')} – ${esc(tName(m.team_b) || '?')}</b><small>${esc(matchSection(m))}</small></span>
      <span class="arw">${svg(ICON.chev,'width:15px;height:15px;stroke-width:2')}</span>
    </button>`).join('')}</div>
    <div style="margin-top:20px"><button class="btn ghost block" data-x="cancel">Avbryt</button></div>`);
  box.querySelector('[data-x="cancel"]').onclick = close;
  box.querySelectorAll('[data-pick]').forEach(btn => btn.onclick = async () => {
    const ok = await rpc('kubb_select_court_match', { p_court:court, p_match:btn.dataset.pick }, 'Kampen er satt på banen');
    if(ok) close();
  });
}

function sheetSetup(){
  const { box, close } = sheet(`
    <h2>Innstillinger</h2><p class="lede">Gjelder hele turneringen.</p>
    <label class="field"><span>Navn</span><input id="f-name" value="${esc(S.t.name)}" maxlength="60"></label>
    <label class="field"><span>Kamplengde i minutter</span><input id="f-min" type="number" min="1" max="180" inputmode="numeric" value="${Math.round(S.t.match_seconds/60)}">
      <small>En kamp kan avgjøres når som helst før tiden går ut. Går tiden ut uten vinner, blir det uavgjort.</small></label>
    <label class="field"><span>Antall baner</span><input id="f-courts" type="number" min="1" max="20" inputmode="numeric" value="${S.t.num_courts}"></label>

    <div style="margin-top:22px" class="cluster">
      <button class="btn" data-x="cancel">Avbryt</button>
      <button class="btn primary" data-x="save">Lagre</button></div>`);
  box.querySelector('[data-x="cancel"]').onclick = close;

function sheetTeams(){
  const names = S.teams.slice().sort((a,b) => (a.seed||0) - (b.seed||0)).map(t => t.name);
  const fields = Array.from({length:16}, (_, i) => `<label class="team-slot">
    <span>Lag ${i + 1}${i < 2 ? ' · arrangør' : ''}</span>
    <input class="team-name" maxlength="40" autocomplete="off" placeholder="Lagnavn" value="${esc(names[i] || '')}">
  </label>`).join('');
  const { box, close } = sheet(`
    <h2>Lag og puljer</h2>
    <p class="lede">Fyll inn 12–16 lag. Tomme felt ignoreres; med 13–15 lag får noen puljer tre lag. De to første utfylte lagene får arrangørtilgang med sin egen lagkode.</p>
    <div class="team-grid">${fields}</div>
    <p class="lede" style="margin-top:18px">Når du lagrer får lagene nye koder, og en eventuell pågående turnering nullstilles.</p>
    <div class="cluster"><button class="btn" data-x="cancel">Avbryt</button><button class="btn primary" data-x="save">Lagre lag</button></div>`);

  box.querySelector('[data-x="cancel"]').onclick = close;
  box.querySelector('[data-x="save"]').onclick = async e => {
    const entered = [...box.querySelectorAll('.team-name')].map(n => n.value.trim()).filter(Boolean);
    if(entered.length < 12 || entered.length > 16){ toast('Legg inn mellom 12 og 16 lag', true); return; }
    const teams = entered.map(name => ({ name, grp:'A' }));
    e.currentTarget.classList.add('busy');
    const ok = await rpc('kubb_admin_set_teams', { p_teams: teams }, `${teams.length} lag lagret`);
    if(ok) close(); else e.currentTarget.classList.remove('busy');
  };
}

async function sheetKeys(){
  const { data, error } = await sb.rpc('kubb_admin_codes', { p_code: S.code });
  if(error){ toast(String(error.message), true); return; }
  const rows = data || [];
  const { box, close } = sheet(`
    <h2>Koder</h2>
    <p class="lede">Én kode per lag. De to første lagene i listen har arrangørtilgang og kan trekke puljer, dele koder og rette resultater.</p>
    ${rows.length ? `<div class="keys">${rows.map(r => `<div class="key"><small>Pulje ${esc(r.grp)}</small><b>${esc(r.team_name)}</b><i>${esc(r.code)}</i></div>`).join('')}</div>`
                  : `<p class="lede">Ingen lag lagt inn ennå.</p>`}
    <label class="field"><span>Arrangørkode</span>
      <span class="cluster" style="align-items:stretch"><input id="ac" inputmode="numeric" maxlength="4" value="${esc(S.code)}"><button class="btn" data-x="setac" style="flex:0 0 auto">Bytt</button></span>
      <small>Fire siffer. Denne gir tilgang til alt oppsett.</small></label>
    <div style="margin-top:20px" class="cluster">
      <button class="btn quiet" data-x="copy">Kopier alle</button>
      <button class="btn" data-x="close">Lukk</button></div>`);

  box.querySelector('[data-x="close"]').onclick = close;
  box.querySelector('[data-x="copy"]').onclick = async () => {
    const txt = rows.map(r => `${r.team_name} (pulje ${r.grp}): ${r.code}`).join('\n');
    try { await navigator.clipboard.writeText(txt); toast('Kodene er kopiert'); }
    catch(_){ toast('Nettleseren tillot ikke kopiering', true); }
  };
  box.querySelector('[data-x="setac"]').onclick = async () => {
    const v = box.querySelector('#ac').value.trim();
    if(!/^\d{4}$/.test(v)){ toast('Arrangørkoden må være fire siffer', true); return; }
    const { error:e2 } = await sb.rpc('kubb_admin_set_admin_code', { p_code:S.code, p_new:v });
    if(e2){ toast(String(e2.message).replace(/^.*?:\s*/, ''), true); return; }
    S.code = v; store.set('kubb.code', v); close(); toast('Arrangørkoden er byttet');
  };
}

function bigScreen(on){
  S.tv = on;
  document.body.classList.toggle('tv', on);
  document.querySelector('.tv-exit')?.remove();
  if(on){
    S.tab = 'courts';
    const b = el('button', 'btn sm tv-exit');
    b.textContent = 'Avslutt oversikt';
    b.onclick = () => { bigScreen(false); S.tab = 'admin'; buildNav(); paint(); };
    document.body.appendChild(b);
    document.documentElement.requestFullscreen?.().catch(()=>{});
    history.replaceState(null, '', '#tv');
  } else {
    if(document.fullscreenElement) document.exitFullscreen?.().catch(()=>{});
    history.replaceState(null, '', location.pathname);
  }
  buildNav(); paint();
}
document.addEventListener('fullscreenchange', () => { if(!document.fullscreenElement && S.tv) bigScreen(false); });

  const saved = store.get('kubb.code');
  if(saved && /^\d{4}$/.test(saved)){ pin = saved; paintDots(); await submitPin(); }
  else if(location.hash === '#tv'){ S.role = 'guest'; await boot(); }
  if(location.hash === '#tv' && !$('#app').classList.contains('hide')) bigScreen(true);
})();
</script>
</body>
